name: 'Package cache'
description: >-
  Gets a token for the Infragnite package cache with the job's GitHub OIDC token and sends Gradle's
  Maven Central and Plugin Portal downloads through the cache. The job needs `permissions: id-token: write`
  and its repository or owner in the cache's trust list.

inputs:
  url:
    description: 'The package cache'
    required: false
    default: 'https://maven.infragnite.dev'
  gradle:
    description: >-
      Send Gradle's Maven Central and Plugin Portal downloads through the cache, and fetch the
      distributions of the workspace's Gradle wrappers through it. Run it after actions/checkout.
    required: false
    default: 'true'
  maven:
    description: >-
      Send Maven's Central downloads through the cache: adds a mirror and its server to ~/.m2/settings.xml,
      keeping what is there. Run it after anything that rewrites that file, such as actions/setup-java.
    required: false
    default: 'false'

outputs:
  token:
    description: 'The cache token (6 h), for other downloads: Basic auth with any user name, or Bearer'
    value: ${{ steps.token.outputs.token }}

runs:
  using: 'composite'
  steps:
    - name: Get a package cache token
      id: token
      shell: bash
      env:
        CACHE_URL: ${{ inputs.url }}
      run: |
        set -euo pipefail
        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
          echo "::error::package-cache: no GitHub OIDC token; the job needs 'permissions: id-token: write'"
          exit 1
        fi
        audience="${CACHE_URL#https://}"
        # GitHub's token service and the cache answer 5xx or 429 at times (a 503 failed a krusty
        # job on 2026-11-24): curl retries those and timeouts, never a refusal such as 401, six
        # times with its own backoff (1, 2, 4, 8, 16, 32 s), within 60 s in all.
        retry=(--retry 6 --retry-max-time 60 --max-time 30)
        oidc_response=$(curl -fsS "${retry[@]}" -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$audience" || true)
        oidc=$(printf '%s' "$oidc_response" | sed -n 's/.*"value":"\([^"]*\)".*/\1/p')
        if [ -z "$oidc" ]; then
          echo "::error::package-cache: GitHub did not issue an OIDC token"
          exit 1
        fi
        cache_response=$(curl -sS "${retry[@]}" -X POST -H "Authorization: Bearer $oidc" "$CACHE_URL/token" || true)
        token=$(printf '%s' "$cache_response" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
        if [ -z "$token" ]; then
          echo "::error::package-cache: $CACHE_URL refused the OIDC token: $cache_response"
          exit 1
        fi
        echo "::add-mask::$token"
        echo "token=$token" >> "$GITHUB_OUTPUT"
        {
          echo "PACKAGE_CACHE_URL=$CACHE_URL"
          echo "PACKAGE_CACHE_TOKEN=$token"
        } >> "$GITHUB_ENV"

    - name: Send Gradle's downloads through the cache
      if: inputs.gradle == 'true'
      shell: bash
      run: |
        init_d="${GRADLE_USER_HOME:-$HOME/.gradle}/init.d"
        mkdir -p "$init_d"
        cp "$GITHUB_ACTION_PATH/package-cache.init.gradle" "$init_d/package-cache.gradle"

    - name: Fetch the Gradle wrappers' distributions through the cache
      if: inputs.gradle == 'true'
      shell: bash
      run: python3 -I "$GITHUB_ACTION_PATH/gradle-wrappers.py" "$GITHUB_WORKSPACE" "${GRADLE_USER_HOME:-$HOME/.gradle}"

    - name: Send Maven's downloads through the cache
      if: inputs.maven == 'true'
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$HOME/.m2"
        python3 -I "$GITHUB_ACTION_PATH/maven-settings.py" "$HOME/.m2/settings.xml"
